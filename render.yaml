# render.yaml — Render Infrastructure as Code for FleetGrid
# https://render.com/docs/blueprint-spec
#
# HOW TO DEPLOY ON RENDER:
#   1. Go to https://dashboard.render.com
#   2. Review the Blueprint changes and database plan before applying.
#   3. Confirm the selected repository and branch are the intended release branch.
#   4. Services have autoDeploy disabled below; deploy manually only after migration and smoke tests.
#      - fleetgrid-app: The Full-Stack Node Web App (UI + Google Maps + API + WebSockets)
#      - fleetgrid-backend: Python FastAPI backend (optional)
#      - fleetgrid-db: PostgreSQL database (optional)

services:
  # ── 1. FleetGrid Full-Stack Production App (React + Express + WebSockets) ──
  - type: web
    name: fleetgrid-app
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm --prefix fleetgrid/web install && npm --prefix fleetgrid/web run build && npm --prefix fleetgrid/server install && npm --prefix fleetgrid/server run build
    startCommand: cd fleetgrid/server && npm run serve
    healthCheckPath: /api
    autoDeploy: false

    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: AUTO_SEED
        value: "false"
      - key: APP_BASE_URL
        value: https://fleetgrid-app.onrender.com
      - key: CORS_ORIGIN
        value: "https://ember-beryl-phi.vercel.app,https://fleetgrid-app.onrender.com"
      # Do not attach fleetgrid-db here: it is the legacy relational database
      # still used by the Python service. Configure a separate Node PostgreSQL
      # target manually only after backup/restore and migration gates are approved.
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM

  # ── 2. FleetGrid Python Backend (FastAPI + GPS Simulations) ──────────────
  - type: web
    name: fleetgrid-backend
    runtime: python
    plan: free
    autoDeploy: false
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Do not run Alembic DDL automatically on production startup; migrate only after backup and approval.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fleetgrid-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LEGACY_API_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "https://ember-beryl-phi.vercel.app,https://fleetgrid-app.onrender.com"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "6"

databases:
  - name: fleetgrid-db
    plan: free
    databaseName: fleetgrid
    user: fleetgrid
