name: FleetGrid checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'fleetgrid/**'
      - 'package.json'
      - 'render.yaml'
      - '.github/workflows/fleetgrid-checks.yml'
  push:
    branches: [main, 'upgrade/**']
    paths:
      - 'fleetgrid/**'
      - 'package.json'
      - 'render.yaml'
      - '.github/workflows/fleetgrid-checks.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend and backend
        run: npm run build
      - name: Run backend end-to-end tests
        run: |
          npm run dev --prefix fleetgrid/server > /tmp/fleetgrid-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/health; then
              npm test
              exit $?
            fi
            sleep 2
          done
          cat /tmp/fleetgrid-server.log
          exit 1
      - name: Show API logs on failure
        if: failure()
        run: cat /tmp/fleetgrid-server.log || true
